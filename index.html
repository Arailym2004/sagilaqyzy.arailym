<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сағилақызы Арайлым - Кәсіби Портфолио</title>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 100%, #d9e2ec 0%);

            margin: 0;
            padding: 40px 20px;
            display: flex;

            align-items: center;

        .container {
            background: white;

            width: 100%;
        }
        header {

            margin-bottom: 30px;

            padding-bottom: 20px;
        }
        h1 {
            color: #0b69a3;
            margin-bottom: 5px;
            font-size: 2.2em;
        }
        .subtitle {
            color: #486581;
            font-size: 1.2em;
            font-weight: 600;
        }
        .section-title {
            color: #243b53;

            border-left: 4px solid #0b69a3;
            padding-left: 10px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
        }
        .info-item p {
            margin: 5px 0;
            font-size: 0.95em;

            background: #f0fdf4;

            padding: 15px 20px;

        }

        }

            font-size: 0.95em;

            margin-top: 15px;
        }
